name: ZenCalendar (APK + exe)

# Cada cambio en main compila la app de Android (ZenCalendar.apk) y la de
# Windows (instalador + portable) y las publica en Releases:
#   android-latest → la última APK, siempre en el mismo enlace, con version.txt
#                    («<compilación> <sha256> <versión>»): la app de Android se
#                    actualiza sola desde aquí en cada compilación (versionCode = run_number)
#   pc-latest      → el último instalador/portable (el instalado se actualiza solo
#                    desde aquí, pero solo cuando cambia VERSION: electron-updater compara la versión)
#   v<VERSION>     → la release oficial (la «latest» de GitHub, la de los enlaces de la
#                    web), con los tres archivos. Se crea UNA vez por versión: la primera
#                    compilación en la que salen bien Android y Windows. Para sacar una
#                    versión nueva basta con cambiar el archivo VERSION.
# Los client IDs de Google salen de las *variables* del repo (Settings → Secrets and
# variables → Actions → Variables). Si no están, la app funciona igual pero sin Drive.

on:
  push:
    branches: [main]
    paths: ['VERSION', 'android/**', 'web/**', 'desktop/**', 'tools/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

# (dos cambios seguidos: el segundo espera al primero, para que no se pisen al subir a las releases)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
  GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
  GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET || vars.GOOGLE_DESKTOP_CLIENT_SECRET }}
  GOOGLE_ANDROID_ENABLED: ${{ vars.GOOGLE_ANDROID_ENABLED }}
  # workspaces compartidos (Firebase, docs/FIREBASE-SETUP.md); sin ellas la app va igual, sin workspaces
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}

jobs:
  # la versión sale del archivo VERSION; «release» dice si todavía no existe
  # la release oficial v<VERSION> (si ya existe, esta compilación solo
  # actualiza android-latest y pc-latest)
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::VERSION tiene que ser X.Y.Z (ahora: «$V»)"; exit 1; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "La release v$V ya existe: solo se actualizan android-latest y pc-latest."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Si todo sale bien, se crea la release oficial v$V."
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de web/js/core
        run: node tests/core/run.js

  apk:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuración (Google y versión)
        env:
          ZC_VERSION: ${{ needs.version.outputs.v }}
        run: node tools/setconfig.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nombre y versión
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk ZenCalendar.apk
          # lo que mira la app para actualizarse: «<versionCode> <sha256> <versionName>»
          echo "${{ github.run_number }} $(sha256sum ZenCalendar.apk | cut -d' ' -f1) ${{ needs.version.outputs.v }}" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZenCalendar-apk
          path: ZenCalendar.apk

      - name: Publicar (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZenCalendar para Android
          prerelease: true
          make_latest: false
          body: Última compilación (versión ${{ needs.version.outputs.v }}, compilación ${{ github.run_number }}). Descarga ZenCalendar.apk e instálala en el móvil; después se actualiza sola desde aquí.
          files: |
            ZenCalendar.apk
            version.txt

  desktop:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuración (Google y versión)
        shell: bash
        env:
          ZC_VERSION: ${{ needs.version.outputs.v }}
        run: node tools/setconfig.js

      - name: Compilar
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm version "${{ needs.version.outputs.v }}" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis portable --publish never
          ls dist
          # la portable mira este archivo para saber si hay versión nueva
          echo "${{ needs.version.outputs.v }} $(sha256sum dist/ZenCalendar-Instalador.exe | cut -d' ' -f1) $(sha256sum dist/ZenCalendar-Portable.exe | cut -d' ' -f1)" > dist/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZenCalendar-windows
          path: |
            desktop/dist/ZenCalendar-Instalador.exe
            desktop/dist/ZenCalendar-Portable.exe

      - name: Publicar (pc-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: ZenCalendar para Windows
          prerelease: true
          make_latest: false
          body: Última compilación (versión ${{ needs.version.outputs.v }}, compilación ${{ github.run_number }}). El instalador se actualiza solo desde aquí cuando sale una versión nueva.
          files: |
            desktop/dist/ZenCalendar-Instalador.exe
            desktop/dist/ZenCalendar-Instalador.exe.blockmap
            desktop/dist/ZenCalendar-Portable.exe
            desktop/dist/latest.yml
            desktop/dist/version.txt

  # la release oficial v<VERSION>, marcada como «latest»: de aquí salen los
  # enlaces de la web (releases/latest/download/ZenCalendar.apk,
  # ZenCalendar-Instalador.exe y ZenCalendar-Portable.exe). Solo si todavía no
  # existe y si han salido bien Android y Windows; si algo falla, la siguiente
  # compilación lo vuelve a intentar con la misma versión.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, apk, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: ZenCalendar v${{ needs.version.outputs.v }}
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            out/ZenCalendar.apk
            out/ZenCalendar-Instalador.exe
            out/ZenCalendar-Portable.exe
          body: |
            ## ZenCalendar v${{ needs.version.outputs.v }}

            Tu calendario tranquilito, para Android y Windows, sincronizado con tu Google Drive.

            **Windows** — `ZenCalendar-Instalador.exe` (se instala como una app más, se queda junto al reloj para avisarte y se actualiza sola) o `ZenCalendar-Portable.exe` (sin instalar: los datos van en una carpeta al lado).

            **Android** — descarga `ZenCalendar.apk` e instálala (Android te pedirá permitir apps de esta fuente); después se actualiza sola. Trae widgets «Agenda» y «Hoy».

            ### ¿Es seguro? Sí

            Windows y Android pueden avisar de que ZenCalendar es «peligroso» o «no seguro». **No es por lo que hace, es porque no está firmado** con un certificado de pago ni viene de una tienda oficial.

            - **Windows** («Windows protegió su PC»): *Más información → Ejecutar de todas formas*.
            - **Android** («App no segura» de Play Protect): *Más detalles → Instalar de todas formas*.

            Todo el código es abierto y estos archivos los compila GitHub Actions a partir de él. Tus eventos se quedan en tu dispositivo y, si quieres, en una carpeta oculta de **tu** Google Drive. Sin cuentas propias, sin anuncios y sin servidores. Más en el [README](https://github.com/luckicla/zencalendar#es-seguro).
